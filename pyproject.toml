[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-recall"
version = "0.1.0"
description = "Local project decisions with explicit approval and recoverable task context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-recall = "projectrecall.cli:main"

[tool.setuptools]
py-modules = ["project_recall"]

[tool.setuptools.packages.find]
include = ["projectrecall*"]
[tool.setuptools.data-files]
"share/project-recall" = ["NOTICE.md"]
